services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prozorro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: ProzorroDataMining.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=prozorro_db;Username=postgres;Password=postgres"
      Prozorro__BaseUrl: "https://public-api.prozorro.gov.ua/"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ProzorroDataMining.Worker/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=prozorro_db;Username=postgres;Password=postgres"
      Prozorro__BaseUrl: "https://public-api.prozorro.gov.ua/"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  ui:
    build:
      context: ./frontend/ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data: